services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=replace-with-a-secure-secret-key-in-prod
      - JWT_SECRET_KEY=replace-with-a-secure-jwt-secret-in-prod
      - MONGO_URI=mongodb://mongodb:27017/peerconnect
      - MONGO_DB_NAME=peerconnect
      - FRONTEND_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
